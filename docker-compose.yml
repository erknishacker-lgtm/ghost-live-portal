services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ghost_live_portal
    ports:
      - "5432:5432"
    volumes:
      - ghost_live_db:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ghost_live_portal?schema=public
    ports:
      - "3000:3000"

volumes:
  ghost_live_db:
